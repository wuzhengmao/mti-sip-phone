name: 构建

# 两条使用方式：
#   1) **本地发布（默认）**：scripts/release.sh 在本机容器编 10 个产物，同时触发本工作流
#      编 macOS，跑完下载回来统一打包上传（本文件的 macos job 只负责构建与上传 artifact）。
#   2) **CI 全量发布**：手动 Run workflow 时把 publish 选 true（或 scripts/release.sh --ci），
#      ubuntu 容器编 Windows/Linux、macos 编 darwin，最后一个 publish job 直接打包上传到
#      更新站点——本地不需要再下载/重新打包。
#
# **不随 push/PR 自动跑**：只在手动或脚本（workflow_dispatch）驱动时执行
#（macOS runner 10 倍计费，日常改动不需要每次都编 macOS）。

on:
  workflow_dispatch:
    inputs:
      release:
        description: 按正式版构建（SIP_PHONE_RELEASE=1，版本号不带 -rc）
        type: choice
        options: ["false", "true"]
        default: "false"
      publish:
        description: 构建完成后直接上传到更新站点（需要仓库里的发布令牌）
        type: choice
        options: ["false", "true"]
        default: "false"
      build_linux:
        description: 构建 Windows/Linux 10 个产物（本地发布只编 macOS 时选 false）
        type: choice
        options: ["true", "false"]
        default: "true"
      only:
        description: 只发某个应用（all = 完整版 + 无 UI 版一起发）
        type: choice
        options: ["all", "full", "no-ui"]
        default: "all"
      title:
        description: 发布标题（留空 = <APP_ID> <版本>）
        type: string
        default: ""
      channel:
        description: 发布通道（留空 = 站点默认）
        type: string
        default: ""
      mandatory:
        description: 强制更新
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows/Linux 的 10 个产物：与本地发布同一条容器链路（docker/build.sh）
  # ---------------------------------------------------------------------------
  linux:
    name: Windows/Linux 产物（容器）
    # 本地发布（release.sh 默认流程）只编 macOS，Windows/Linux 由本机容器出；
    # 只有 CI 全量发布（--ci / publish=true）才在这里编那 10 个。
    if: ${{ inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # 空值 = 开发版（版本带 -rc）；"1" = 正式版（docker/build.sh 用 -e 透传进容器）
      SIP_PHONE_RELEASE: ${{ inputs.release == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      # 第三方静态库（视频/Opus/AEC）在仓库里不入库，首次运行要编一次（较久），
      # 之后从缓存恢复，不再重复编译。版本相关的脚本变了才失效。
      # restore/save 分开：构建失败也把已经编好的库存下来（缓存键不变就不用重来）。
      - name: 恢复第三方静态库缓存
        id: thirdparty
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/video
            third_party/audio
          key: third-party-v1-${{ runner.os }}-${{ hashFiles('scripts/build-video-libs.sh', 'scripts/build-audio-libs.sh', 'docker/Dockerfile', 'docker/build.sh') }}

      - name: 拉构建镜像
        run: docker pull wuzm219/msp-builder:latest

      - name: 编译（缺第三方库时先补编，结果会写入缓存）
        run: |
          set -euo pipefail
          chmod +x docker/build.sh
          need=0
          for t in windows-amd64 windows-386 linux-amd64 linux-arm64; do
            for lib in libavcodec.a libavutil.a libswscale.a libvpx.a libopenh264.a; do
              [ -f "third_party/video/$t/lib/$lib" ] || need=1
            done
            [ -f "third_party/audio/$t/lib/libopus.a" ] || need=1
          done
          if [ "$need" = 1 ]; then
            echo "第三方静态库缺失（首次运行或缓存失效），先编译（较久，完成后续运行走缓存）"
            ./docker/build.sh --libs
          fi
          ./docker/build.sh

      - name: 检查第三方库是否齐全（半成品不进缓存）
        id: thirdparty-check
        if: always() && steps.thirdparty.outputs.cache-hit != 'true'
        run: |
          ok=true
          for t in windows-amd64 windows-386 linux-amd64 linux-arm64; do
            for lib in libavcodec.a libavutil.a libswscale.a libvpx.a libopenh264.a; do
              [ -f "third_party/video/$t/lib/$lib" ] || ok=false
            done
            [ -f "third_party/audio/$t/lib/libopus.a" ] || ok=false
          done
          echo "complete=$ok" >> "$GITHUB_OUTPUT"

      - name: 保存第三方静态库缓存
        if: always() && steps.thirdparty-check.outputs.complete == 'true' && steps.thirdparty.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/video
            third_party/audio
          key: ${{ steps.thirdparty.outputs.cache-primary-key }}

      - name: 校验 10 个产物齐全
        run: |
          set -e
          for f in \
            dist/sip-phone-windows-amd64.exe \
            dist/sip-phone-windows-386.exe \
            dist/sip-phone-windows-arm64.exe \
            dist/sip-phone-linux-amd64 \
            dist/sip-phone-linux-arm64 \
            dist/sip-phone-no-ui-windows-amd64.exe \
            dist/sip-phone-no-ui-windows-386.exe \
            dist/sip-phone-no-ui-windows-arm64.exe \
            dist/sip-phone-no-ui-linux-amd64 \
            dist/sip-phone-no-ui-linux-arm64; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          ls -lh dist/ | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/sip-phone-windows-amd64.exe
            dist/sip-phone-windows-386.exe
            dist/sip-phone-windows-arm64.exe
            dist/sip-phone-linux-amd64
            dist/sip-phone-linux-arm64
            dist/sip-phone-no-ui-windows-amd64.exe
            dist/sip-phone-no-ui-windows-386.exe
            dist/sip-phone-no-ui-windows-arm64.exe
            dist/sip-phone-no-ui-linux-amd64
            dist/sip-phone-no-ui-linux-arm64
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS：两个架构的裸二进制 + universal DMG
  # ---------------------------------------------------------------------------
  macos:
    name: macOS universal DMG
    # macos-15 = Apple Silicon（arm64）。build.sh 会用 clang -arch 同时编出
    # amd64 与 arm64 两份裸二进制，再由 package-macos.sh lipo 成 universal。
    # 不用 macos-14：该镜像 2026-11-02 退役，brownout 期间任务会被直接判失败；
    # 也不用 macos-latest（会随 GitHub 滚动升级，构建环境不可预期）。
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SIP_PHONE_RELEASE: ${{ inputs.release == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 环境信息
        run: |
          go version
          uname -m
          clang --version | head -1

      - name: 静态检查（涵盖 darwin 专有文件）
        run: go vet ./...

      - name: 编译 darwin（amd64 + arm64，两个变体）
        run: |
          chmod +x build.sh scripts/package-macos.sh
          ./build.sh --target darwin

      - name: 单元测试
        run: >
          go test ./internal/appicon/ ./internal/macbundle/ ./internal/macurl/
          ./internal/selfinstall/ ./internal/protocol/

      - name: 冒烟测试（本机架构）
        run: |
          ./dist/sip-phone-darwin-arm64 --version
          ./dist/sip-phone-no-ui-darwin-arm64 --version

      - name: 打包 universal DMG（完整版 + 无 UI 版）
        run: ./scripts/package-macos.sh --variant both --arch universal

      - name: 校验产包
        run: |
          set -e
          lipo -info "dist/macos/MTI软电话-无UI版.app/Contents/MacOS/mti-sip-phone-no-ui"
          lipo -info "dist/macos/MTI软电话.app/Contents/MacOS/mti-sip-phone"
          plutil -lint "dist/macos/MTI软电话-无UI版.app/Contents/Info.plist"
          plutil -lint "dist/macos/MTI软电话.app/Contents/Info.plist"
          # URL scheme 与仅托盘（LSUIElement）必须在 plist 里
          plutil -extract CFBundleURLTypes xml1 -o - "dist/macos/MTI软电话-无UI版.app/Contents/Info.plist"
          ls -lh dist/macos/*.dmg

      # 运行期冒烟：macOS runner 有真实图形会话，可以启动 App 验证自安装、LaunchServices
      # 收录与 sip:// 苹果事件——这三条是 macOS 专用的、单元测试覆盖不到的路径。
      # 交互观感（拖拽、吸附、菜单栏点击）仍需真机，这里不做。
      - name: 冒烟测试（自安装 / 启动 / sip:// 苹果事件 / 注册项）
        run: |
          set -uo pipefail
          APP_DIR="$HOME/Library/Application Support/mti-sip-phone"
          BUNDLE="$APP_DIR/MTI软电话-无UI版.app"
          EXE="$BUNDLE/Contents/MacOS/mti-sip-phone-no-ui"
          LOG="$APP_DIR/logs/sip-phone.log"
          pkill -f "$EXE" 2>/dev/null || true
          pkill -f 'sip-phone-no-ui-darwin' 2>/dev/null || true
          sleep 1
          rm -rf "$APP_DIR"

          echo "== 1) 裸二进制自安装成 .app =="
          ./dist/sip-phone-no-ui-darwin-arm64 >/tmp/bare.log 2>&1 &
          for i in $(seq 1 30); do [ -x "$EXE" ] && break; sleep 1; done
          [ -x "$EXE" ] || { echo "::error::没有生成应用包"; cat /tmp/bare.log; exit 1; }
          [ -f "$BUNDLE/Contents/Info.plist" ] || { echo "::error::缺 Info.plist"; exit 1; }
          [ -f "$BUNDLE/Contents/Resources/AppIcon.icns" ] || { echo "::error::缺图标"; exit 1; }
          plutil -lint "$BUNDLE/Contents/Info.plist"
          ls -la "$HOME/Desktop" || true

          echo "== 2) 进程从包内可执行文件启动 =="
          PID=""
          for i in $(seq 1 30); do PID="$(pgrep -f "$EXE" | head -1 || true)"; [ -n "$PID" ] && break; sleep 1; done
          [ -n "$PID" ] || { echo "::error::进程没起来"; tail -80 "$LOG" 2>/dev/null; exit 1; }
          echo "PID=$PID"

          echo "== 3) 启动日志与崩溃记录 =="
          for i in $(seq 1 20); do grep -q "mti-sip-phone 启动" "$LOG" 2>/dev/null && break; sleep 1; done
          grep -q "mti-sip-phone 启动" "$LOG" || { echo "::error::没有启动日志"; tail -80 "$LOG" 2>/dev/null; exit 1; }
          # crash.log 启动时**一定会写一行标题**（"=== 时间 banner ==="），只有标题行
          # 说明正常；标题行之外还有内容才是真崩溃（logx/crash.go 的口径）。
          if [ -f "$APP_DIR/logs/crash.log" ]; then
            EXTRA="$(grep -vc '^=== ' "$APP_DIR/logs/crash.log" || true)"
            if [ "${EXTRA:-0}" -gt 0 ]; then
              echo "::error::崩溃记录里有内容"
              cat "$APP_DIR/logs/crash.log"
              exit 1
            fi
          fi
          sleep 5
          kill -0 "$PID" 2>/dev/null || {
            echo "::error::进程启动后很快退出（疑似崩溃）"
            tail -120 "$LOG" 2>/dev/null
            cat "$APP_DIR/logs/crash.log" 2>/dev/null
            exit 1
          }

          echo "== 4) LaunchServices 收录 =="
          LSREG="/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister"
          if "$LSREG" -dump 2>/dev/null | grep -qi "cn.mti.sip-phone-no-ui"; then
            echo "已收录"
          else
            echo "::warning::lsregister 里没看到条目（协议注册可能没生效）"
          fi

          echo "== 5) 开机自启 LaunchAgent =="
          [ -f "$HOME/Library/LaunchAgents/cn.mti.sip-phone.plist" ] &&
            echo "LaunchAgent OK" || echo "::warning::没有 LaunchAgent 文件"

          echo "== 6) sip:// 苹果事件 =="
          open "sip://1001:pwd@127.0.0.1:5060" || echo "::warning::open sip:// 返回非零"
          for i in $(seq 1 20); do grep -q "收到苹果事件的 sip:// 链接" "$LOG" 2>/dev/null && break; sleep 1; done
          grep -q "收到苹果事件的 sip:// 链接" "$LOG" || {
            echo "::error::没有收到苹果事件（sip:// 拉起失败）"
            tail -120 "$LOG" 2>/dev/null
            exit 1
          }

          echo "== 7) 截图（仅供参考）=="
          screencapture -x /tmp/macos-smoke.png 2>/dev/null || echo "::warning::screencapture 失败"
          cp "$LOG" /tmp/sip-phone.log 2>/dev/null || true

          pkill -f "$EXE" 2>/dev/null || true
          echo "冒烟测试通过"

      # 发布用：两个架构的裸二进制（自动更新下载的就是它，不能是 DMG）
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: |
            dist/sip-phone-darwin-amd64
            dist/sip-phone-darwin-arm64
            dist/sip-phone-no-ui-darwin-amd64
            dist/sip-phone-no-ui-darwin-arm64
          if-no-files-found: error
          retention-days: 14

      # 首次安装用：universal DMG（完整版 + 无 UI 版各一个）
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

      # 冒烟测试的截图与运行日志（失败也上传，方便排查）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: |
            /tmp/macos-smoke.png
            /tmp/sip-phone.log
            /tmp/bare.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 一次上传：把前两个 job 的产物收齐，打包并上传到更新站点
  # ---------------------------------------------------------------------------
  publish:
    name: 打包并上传到更新站点
    needs: [linux, macos]
    if: ${{ inputs.publish == 'true' && inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos-dmg

      - name: 打包并上传（release.sh --no-build）
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_MANDATORY: ${{ inputs.mandatory }}
        run: |
          set -euo pipefail
          chmod +x scripts/release.sh
          # DMG 文件名带版本号，换成 release.sh 认的稳定名（与本地 --darwin-ci 的收集口径一致）
          cp "$(ls dist/macos-dmg/MTI-SIP-Phone-full-*.dmg | head -1)"  dist/macos-dmg-full.dmg
          cp "$(ls dist/macos-dmg/MTI-SIP-Phone-no-ui-*.dmg | head -1)" dist/macos-dmg-no-ui.dmg
          chmod 755 dist/sip-phone-* || true
          # 站点是「同名版本整体替换」：上传前必须确认产物齐全，否则会用残缺版本覆盖线上
          for f in \
            dist/sip-phone-windows-amd64.exe dist/sip-phone-windows-386.exe \
            dist/sip-phone-windows-arm64.exe dist/sip-phone-linux-amd64 dist/sip-phone-linux-arm64 \
            dist/sip-phone-no-ui-windows-amd64.exe dist/sip-phone-no-ui-windows-386.exe \
            dist/sip-phone-no-ui-windows-arm64.exe dist/sip-phone-no-ui-linux-amd64 \
            dist/sip-phone-no-ui-linux-arm64 \
            dist/sip-phone-darwin-amd64 dist/sip-phone-darwin-arm64 \
            dist/sip-phone-no-ui-darwin-amd64 dist/sip-phone-no-ui-darwin-arm64 \
            dist/macos-dmg-full.dmg dist/macos-dmg-no-ui.dmg; do
            [ -f "$f" ] || { echo "::error::缺少产物 $f"; exit 1; }
          done
          args=(--no-build --no-darwin)
          [ "$INPUT_RELEASE" != "true" ] && args+=(--pre)
          [ -n "$INPUT_ONLY" ] && [ "$INPUT_ONLY" != "all" ] && args+=(--only "$INPUT_ONLY")
          [ -n "$INPUT_TITLE" ] && args+=(--title "$INPUT_TITLE")
          [ -n "$INPUT_CHANNEL" ] && args+=(--channel "$INPUT_CHANNEL")
          [ "$INPUT_MANDATORY" = "true" ] && args+=(--mandatory)
          ./scripts/release.sh "${args[@]}"
