name: 构建

# macOS 产物只能在 macOS 上编译（Fyne/OpenGL 与 miniaudio 都要 CGO + Apple SDK），
# 本仓库的开发机以 Windows 为主，所以用 GitHub Actions 的 macOS runner 做
# 「编译 + 单测 + universal DMG 打包」的验证。Windows/Linux 产物仍走各自的构建机。

on:
  push:
    branches: [dev, dev-macOs, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  # 发布时由 scripts/release.sh --darwin-ci 触发（release=true → SIP_PHONE_RELEASE=1）
  workflow_dispatch:
    inputs:
      release:
        description: 按正式版构建（SIP_PHONE_RELEASE=1，版本号不带 -rc）
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal DMG
    # macos-14 = Apple Silicon（arm64）。build.sh 会用 clang -arch 同时编出
    # amd64 与 arm64 两份裸二进制，再由 package-macos.sh lipo 成 universal。
    runs-on: macos-14
    timeout-minutes: 40
    # 空值 = 开发版（版本带 -rc）；"1" = 正式版。build.sh / package-macos.sh 都认它。
    env:
      SIP_PHONE_RELEASE: ${{ inputs.release == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 环境信息
        run: |
          go version
          uname -m
          clang --version | head -1

      - name: 静态检查（涵盖 darwin 专有文件）
        run: go vet ./...

      - name: 编译 darwin（amd64 + arm64，两个变体）
        run: |
          chmod +x build.sh scripts/package-macos.sh
          ./build.sh --target darwin

      - name: 单元测试
        run: >
          go test ./internal/appicon/ ./internal/macbundle/ ./internal/macurl/
          ./internal/selfinstall/ ./internal/protocol/

      - name: 冒烟测试（本机架构）
        run: |
          ./dist/sip-phone-darwin-arm64 --version
          ./dist/sip-phone-no-ui-darwin-arm64 --version

      - name: 打包 universal DMG（完整版 + 无 UI 版）
        run: ./scripts/package-macos.sh --variant both --arch universal

      - name: 校验产包
        run: |
          set -e
          lipo -info "dist/macos/MTI软电话.app/Contents/MacOS/mti-sip-phone-no-ui"
          lipo -info "dist/macos/MTI软电话-完整版.app/Contents/MacOS/mti-sip-phone"
          plutil -lint "dist/macos/MTI软电话.app/Contents/Info.plist"
          plutil -lint "dist/macos/MTI软电话-完整版.app/Contents/Info.plist"
          # URL scheme 与仅托盘（LSUIElement）必须在 plist 里
          plutil -extract CFBundleURLTypes xml1 -o - "dist/macos/MTI软电话.app/Contents/Info.plist"
          ls -lh dist/macos/*.dmg

      # 发布用：两个架构的裸二进制（自动更新下载的就是它，不能是 DMG）
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: |
            dist/sip-phone-darwin-amd64
            dist/sip-phone-darwin-arm64
            dist/sip-phone-no-ui-darwin-amd64
            dist/sip-phone-no-ui-darwin-arm64
          if-no-files-found: error
          retention-days: 14

      # 首次安装用：universal DMG（完整版 + 无 UI 版各一个）
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14
