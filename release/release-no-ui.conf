# 「仅托盘无 UI 版」（mti-sip-phone-no-ui）的发布配置
# scripts/release.sh 默认把两个应用一起发：完整版读 release.conf，本文件读无 UI 版；
# 只想发这一个时加 --only no-ui（或旧的 --no-ui）。
#
# 两个变体在更新站点上是**两个独立应用**：各自的应用 ID、归档目录与上传令牌。
# 客户端一侧的默认应用 ID 也按变体区分（见 internal/variant），
# 否则无 UI 版会去查完整版的发布物、把自己替换成完整版 exe。
#
# 格式与可覆盖规则同 release.conf：KEY=VALUE，# 开头为注释，
# 下列键都可用同名环境变量覆盖。

# 更新站点根地址（与完整版相同）。
UPDATE_SITE=https://update.wuzm219.cn

# 站点应用 ID（同时是归档目录名与 URL 里的标识）。
APP_ID=mti-sip-phone-no-ui

# 上传令牌：由站点的 UPLOAD_SECRET 按应用 ID 推导（站点文档「上传发布」第 1 节）。
UPLOAD_TOKEN=ofs5iuuygns7hpgebofhhmnamoevr6f5

# 站点证书（仅内部/自签名站点需要），同 release.conf 的说明。
#CA_CERT=D:/git/updatesite/certs/server.crt
#INSECURE_TLS=
