# mti-sip-phone 发布配置（scripts/release.sh / scripts/release.bat 读取）
#
# 格式：KEY=VALUE，# 开头为注释。下列键都可用同名环境变量覆盖，便于临时换个站点发布
# （例如对着本地站点验证：UPDATE_SITE=https://localhost:8443 CA_CERT=... ./scripts/release.sh ...）。
# 本文件里所有路径用 Windows 形式（D:/...），git-bash 与 cmd 都能识别。

# 更新站点根地址（不带结尾斜杠）。换站点只改这一行。
# 站点若只开 HTTP 且会 301 跳到 HTTPS，这里要直接写 https 地址——上传是 POST，
# curl 跟随 301 会把 POST 退化成 GET。
UPDATE_SITE=https://update.wuzm219.cn

# 更新站点上的应用 ID（同时是归档目录名与 URL 里的标识）。
APP_ID=mti-sip-phone

# 上传令牌：由站点的 UPLOAD_SECRET 按应用 ID 推导（站点文档「上传发布」第 1 节），
# 上传发布包、写入应用信息与应用图标都用它。换站点时找管理员用
# `updatesite token <应用ID>` 重新算一个。
UPLOAD_TOKEN=cz35c5vq6nbtconerrmokktznwzuv7fh

# 站点证书（仅内部/自签名站点需要）：
#   CA_CERT      站点证书 PEM 路径，脚本用 curl --cacert 校验；证书已被信任时留空。
#   INSECURE_TLS 置 1 跳过证书校验（只在临时调试时用，不建议）。
# 生产站点 update.wuzm219.cn 是 Let's Encrypt 证书，两项都不用配。
#CA_CERT=D:/git/updatesite/certs/server.crt
#INSECURE_TLS=
